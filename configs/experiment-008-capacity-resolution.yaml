experiment:
  id: experiment-008
  name: capacity-resolution-ablation
  seed: 20260803
  output_root: outputs/experiments
  mode: screen-and-confirm-capacity-resolution

competition:
  slug: filament-segmentation-2026
  image_height: 2048
  image_width: 2048
  grayscale: true

data:
  local_root: data/raw/MAGFiLO_1.0_Kaggle_2026
  kaggle_root: /kaggle/input/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_images: train/train_images
  train_annotations: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  test_images: test/test_images

validation:
  strategy: grouped-k-fold
  group_key: file_name
  n_splits: 5
  fold_indices:
    - 0
    - 1
    - 2
    - 3
    - 4
  shuffle: true
  seed: 20260729
  expected_fold_fingerprint: 69a31d113fd4e4cea63f1a072d94dd0dea2c1432c18d349d8a2575c5d1915aa7

model:
  task: instance-segmentation
  architecture: small-unet-capacity-resolution-ablation
  semantic_training_with_instance_separation: true
  pretrained_weights: false
  external_labeled_data: false
  initialization: from-scratch

screen:
  folds:
    - 0
    - 1
  selection_metric: mean-penalized-instance-dice
  minimum_semantic_gain_on_each_screen_fold: 0.005
  settings:
    - id: 1024-base32
      input_size: 1024
      base_channels: 32
    - id: 1280-base24
      input_size: 1280
      base_channels: 24
  baseline_screen_semantic_dice:
    "0": 0.6592034676065585
    "1": 0.6578903202608781

training:
  target_strategy: hybrid-consensus-random-annotator
  consensus_weight: 0.75
  annotator_weight: 0.25
  epochs: 18
  minimum_epochs: 8
  early_stopping_patience: 4
  batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.00015
  weight_decay: 0.0001
  bce_positive_weight: 4.0
  dice_loss_weight: 1.0
  bce_loss_weight: 1.0
  num_workers: 0
  mixed_precision: true
  augmentations:
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate_90_probability: 0.5
    brightness_delta: 0.05
    contrast_range:
      - 0.9
      - 1.1

inference:
  batch_size: 1
  test_time_augmentations:
    - identity
    - horizontal-flip
    - vertical-flip
    - horizontal-vertical-flip

postprocessing:
  source: experiment-006-selected
  probability_threshold: 0.5
  closing_kernel: 7
  closing_iterations: 1
  disk_erosion_pixels: 8
  min_component_area_at_model_resolution: 96
  max_component_area_at_model_resolution: 40000
  minimum_component_mean_probability: 0.8
  connectivity: 8
  matching_min_iou: 0.1

selection:
  minimum_screen_semantic_gain_on_each_fold: 0.005
  prefer_semantic_gate: true
  baseline_experiment: experiment-006
  baseline_mean_penalized_instance_dice: 0.4917500437953408
  baseline_missed_instances: 1681
  baseline_extra_instances: 2095

promotion:
  baseline_experiment: experiment-006
  minimum_mean_penalized_instance_dice: 0.495
  maximum_missed_instances: 1681
  maximum_extra_instances: 2095

metric:
  primary: mean-matched-instance-dice
  diagnostics:
    - semantic-dice-distribution
    - matched-instance-dice
    - matched-instance-iou
    - missed-and-extra-instances
    - one-to-many-relations
    - many-to-one-relations
    - single-versus-multi-annotator-dice
    - screen-semantic-gain-by-fold

submission:
  columns:
    - filament_id
    - segmentation_rle
  rle_format: coco-compressed-counts
  mask_height: 2048
  mask_width: 2048
  output_path: /kaggle/working/experiment-008-submission.csv
