experiment:
  id: experiment-005
  name: hybrid-annotator-recall
  seed: 20260731
  output_root: outputs/experiments
  mode: two-stage-hybrid-finetuning

competition:
  slug: filament-segmentation-2026
  image_height: 2048
  image_width: 2048
  grayscale: true

data:
  local_root: data/raw/MAGFiLO_1.0_Kaggle_2026
  kaggle_root: /kaggle/input/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_images: train/train_images
  train_annotations: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  test_images: test/test_images
  checkpoint_root: /kaggle/input/solar-filament-oof-tta-refinement

validation:
  strategy: grouped-k-fold
  group_key: file_name
  n_splits: 5
  fold_indices:
    - 0
    - 1
    - 2
    - 3
    - 4
  shuffle: true
  seed: 20260729
  expected_fold_fingerprint: 69a31d113fd4e4cea63f1a072d94dd0dea2c1432c18d349d8a2575c5d1915aa7

model:
  task: instance-segmentation
  architecture: small-unet
  semantic_training_with_instance_separation: true
  input_size: 1024
  base_channels: 24
  pretrained_weights: false
  external_labeled_data: false
  competition_trained_checkpoint_source: experiment-003

screen:
  folds:
    - 0
    - 1
  selection_metric: mean-penalized-instance-dice
  weight_pairs:
    - consensus: 0.75
      annotator: 0.25
    - consensus: 0.5
      annotator: 0.5
  reuse_selected_screen_models: true

training:
  target_strategy: hybrid-consensus-random-annotator
  epochs: 12
  minimum_epochs: 6
  early_stopping_patience: 3
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  bce_positive_weight: 4.0
  dice_loss_weight: 1.0
  bce_loss_weight: 1.0
  num_workers: 0
  mixed_precision: true
  augmentations:
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate_90_probability: 0.5
    brightness_delta: 0.05
    contrast_range:
      - 0.9
      - 1.1

inference:
  batch_size: 2
  test_time_augmentations:
    - identity
    - horizontal-flip
    - vertical-flip
    - horizontal-vertical-flip

postprocessing:
  source: experiment-003-oof-selected
  probability_threshold: 0.5
  closing_kernel: 7
  closing_iterations: 1
  disk_erosion_pixels: 8
  min_component_area_at_model_resolution: 96
  max_component_area_at_model_resolution: 40000
  minimum_component_mean_probability: 0.8
  connectivity: 8
  matching_min_iou: 0.1

promotion:
  baseline_experiment: experiment-003
  baseline_mean_penalized_instance_dice: 0.490129
  baseline_missed_instances: 1693
  baseline_extra_instances: 2103
  minimum_mean_penalized_instance_dice: 0.5
  require_lower_missed_instances: true
  maximum_extra_instances: 2103

metric:
  primary: mean-matched-instance-dice
  diagnostics:
    - semantic-dice-distribution
    - matched-instance-dice
    - matched-instance-iou
    - missed-and-extra-instances
    - one-to-many-relations
    - many-to-one-relations
    - single-versus-multi-annotator-dice
    - missed-instances-by-annotator-count

submission:
  columns:
    - filament_id
    - segmentation_rle
  rle_format: coco-compressed-counts
  mask_height: 2048
  mask_width: 2048
  output_path: /kaggle/working/experiment-005-submission.csv
