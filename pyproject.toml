[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament-segmentation"
version = "0.1.0"
description = "Reproducible workspace for the Solar Filament Segmentation Challenge 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10,<13",
  "pycocotools>=2.0.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "kaggle>=2.2,<3",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "data",
  "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
